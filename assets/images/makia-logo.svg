<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- Icono de calendario/reserva -->
  <rect x="25" y="30" width="50" height="45" rx="5" fill="white" opacity="0.9"/>
  <rect x="25" y="30" width="50" height="12" rx="5" fill="white"/>
  
  <!-- Líneas del calendario -->
  <line x1="35" y1="50" x2="65" y2="50" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="60" x2="55" y2="60" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Puntos decorativos -->
  <circle cx="35" cy="38" r="2" fill="#667eea"/>
  <circle cx="50" cy="38" r="2" fill="#667eea"/>
  <circle cx="65" cy="38" r="2" fill="#667eea"/>
</svg>
