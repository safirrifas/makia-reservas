<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakIA Admin - Gestión de Licencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold">MakIA Admin</h1>
                    <p class="text-indigo-200 text-sm">Gestión de Licencias</p>
                </div>
                <button onclick="showCreateModal()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-medium hover:bg-indigo-50 transition">
                    + Nueva Licencia
                </button>
            </div>
        </div>
    </header>

    <!-- Stats -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="stats">
            <div class="bg-white rounded-xl p-4 shadow">
                <p class="text-3xl font-bold text-gray-900" id="stat-total">-</p>
                <p class="text-sm text-gray-500">Total</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <p class="text-3xl font-bold text-green-600" id="stat-active">-</p>
                <p class="text-sm text-gray-500">Activas</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <p class="text-3xl font-bold text-gray-600" id="stat-chupito">-</p>
                <p class="text-sm text-gray-500">Chupito</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <p class="text-3xl font-bold text-yellow-600" id="stat-cana">-</p>
                <p class="text-sm text-gray-500">Caña</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow">
                <p class="text-3xl font-bold text-indigo-600" id="stat-mascana">-</p>
                <p class="text-sm text-gray-500">MasCaña</p>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="max-w-7xl mx-auto px-4 pb-4">
        <div class="bg-white rounded-xl p-4 shadow flex flex-wrap gap-4 items-center">
            <input type="text" id="search" placeholder="Buscar por dominio, cliente..."
                   class="flex-1 min-w-[200px] px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <select id="filter-status" class="px-4 py-2 border rounded-lg">
                <option value="">Todos los estados</option>
                <option value="ACTIVE">Activas</option>
                <option value="SUSPENDED">Suspendidas</option>
                <option value="EXPIRED">Expiradas</option>
            </select>
            <select id="filter-plan" class="px-4 py-2 border rounded-lg">
                <option value="">Todos los planes</option>
                <option value="CHUPITO">Chupito</option>
                <option value="CANA">Caña</option>
                <option value="MASCANA">MasCaña</option>
                <option value="UNLIMITED">Unlimited</option>
            </select>
            <button onclick="loadLicenses()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                Buscar
            </button>
        </div>
    </div>

    <!-- Licenses Table -->
    <div class="max-w-7xl mx-auto px-4 pb-8">
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Dominio</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Cliente</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Plan</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Uso</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Estado</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">Acciones</th>
                    </tr>
                </thead>
                <tbody id="licenses-table">
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                            Cargando licencias...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="modal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h2 id="modal-title" class="text-xl font-bold">Nueva Licencia</h2>
            </div>
            <form id="license-form" class="p-6 space-y-4">
                <input type="hidden" id="form-id">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dominio *</label>
                    <input type="text" id="form-domain" required placeholder="ejemplo.com"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Plan</label>
                    <select id="form-plan" class="w-full px-4 py-2 border rounded-lg">
                        <option value="CHUPITO">Chupito (5/mes - Gratis)</option>
                        <option value="CANA">Caña (15/mes - 5€)</option>
                        <option value="MASCANA">MasCaña (100/mes - 15€)</option>
                        <option value="UNLIMITED">Unlimited (Sin límite)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del cliente</label>
                    <input type="text" id="form-clientName" placeholder="Restaurante Ejemplo"
                           class="w-full px-4 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="form-clientEmail" placeholder="email@ejemplo.com"
                           class="w-full px-4 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" id="form-clientPhone" placeholder="+34 XXX XXX XXX"
                           class="w-full px-4 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
                    <textarea id="form-notes" rows="3" placeholder="Notas internas..."
                              class="w-full px-4 py-2 border rounded-lg"></textarea>
                </div>
            </form>
            <div class="p-6 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-100">
                    Cancelar
                </button>
                <button onclick="saveLicense()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- Actions Modal -->
    <div id="actions-modal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
            <div class="p-6 border-b">
                <h2 class="text-xl font-bold">Acciones de Licencia</h2>
                <p id="actions-domain" class="text-gray-500"></p>
            </div>
            <div class="p-6 space-y-3" id="actions-content">
                <!-- Actions will be inserted here -->
            </div>
            <div class="p-6 border-t bg-gray-50">
                <button onclick="closeActionsModal()" class="w-full px-4 py-2 border rounded-lg hover:bg-gray-100">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1/admin/licenses';
        const ADMIN_TOKEN = 'makia-admin-2024'; // Cambiar en producción

        const PLAN_COLORS = {
            CHUPITO: 'bg-gray-100 text-gray-800',
            CANA: 'bg-yellow-100 text-yellow-800',
            MASCANA: 'bg-indigo-100 text-indigo-800',
            UNLIMITED: 'bg-purple-100 text-purple-800'
        };

        const STATUS_COLORS = {
            ACTIVE: 'bg-green-100 text-green-800',
            SUSPENDED: 'bg-red-100 text-red-800',
            EXPIRED: 'bg-orange-100 text-orange-800',
            INACTIVE: 'bg-gray-100 text-gray-800',
            CANCELLED: 'bg-gray-100 text-gray-800'
        };

        let currentLicense = null;

        async function fetchAPI(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': ADMIN_TOKEN,
                    ...options.headers
                }
            });
            return response.json();
        }

        async function loadLicenses() {
            const search = document.getElementById('search').value;
            const status = document.getElementById('filter-status').value;
            const plan = document.getElementById('filter-plan').value;

            let query = '?';
            if (search) query += `search=${encodeURIComponent(search)}&`;
            if (status) query += `status=${status}&`;
            if (plan) query += `plan=${plan}&`;

            try {
                const result = await fetchAPI(query);

                if (result.success) {
                    renderLicenses(result.data.licenses);
                    renderStats(result.data.stats);
                }
            } catch (error) {
                console.error('Error loading licenses:', error);
                document.getElementById('licenses-table').innerHTML = `
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-red-500">
                            Error al cargar licencias. Verifica la conexión con la API.
                        </td>
                    </tr>
                `;
            }
        }

        function renderStats(stats) {
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-chupito').textContent = stats.byPlan.CHUPITO;
            document.getElementById('stat-cana').textContent = stats.byPlan.CANA;
            document.getElementById('stat-mascana').textContent = stats.byPlan.MASCANA;
        }

        function renderLicenses(licenses) {
            const tbody = document.getElementById('licenses-table');

            if (licenses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                            No se encontraron licencias
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = licenses.map(license => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-3">
                        <div class="font-medium text-gray-900">${license.domain}</div>
                        <div class="text-xs text-gray-500">${license.licenseKey}</div>
                    </td>
                    <td class="px-4 py-3">
                        <div class="text-gray-900">${license.clientName || '-'}</div>
                        <div class="text-xs text-gray-500">${license.clientEmail || ''}</div>
                    </td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${PLAN_COLORS[license.plan]}">
                            ${license.plan}
                        </span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                            <div class="flex-1 bg-gray-200 rounded-full h-2 w-24">
                                <div class="h-2 rounded-full ${license.usagePercent >= 90 ? 'bg-red-500' : license.usagePercent >= 70 ? 'bg-yellow-500' : 'bg-green-500'}"
                                     style="width: ${Math.min(license.usagePercent, 100)}%"></div>
                            </div>
                            <span class="text-sm text-gray-600">
                                ${license.monthlyBookings}/${license.planLimit === -1 ? '∞' : license.planLimit}
                            </span>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${STATUS_COLORS[license.status]}">
                            ${license.status}
                        </span>
                    </td>
                    <td class="px-4 py-3">
                        <button onclick="showActions('${license.id}', '${license.domain}')"
                                class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">
                            Acciones
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function showCreateModal() {
            document.getElementById('modal-title').textContent = 'Nueva Licencia';
            document.getElementById('form-id').value = '';
            document.getElementById('form-domain').value = '';
            document.getElementById('form-plan').value = 'CHUPITO';
            document.getElementById('form-clientName').value = '';
            document.getElementById('form-clientEmail').value = '';
            document.getElementById('form-clientPhone').value = '';
            document.getElementById('form-notes').value = '';
            document.getElementById('form-domain').disabled = false;
            document.getElementById('modal').classList.add('active');
        }

        function showEditModal(license) {
            document.getElementById('modal-title').textContent = 'Editar Licencia';
            document.getElementById('form-id').value = license.id;
            document.getElementById('form-domain').value = license.domain;
            document.getElementById('form-plan').value = license.plan;
            document.getElementById('form-clientName').value = license.clientName || '';
            document.getElementById('form-clientEmail').value = license.clientEmail || '';
            document.getElementById('form-clientPhone').value = license.clientPhone || '';
            document.getElementById('form-notes').value = license.notes || '';
            document.getElementById('form-domain').disabled = true;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function saveLicense() {
            const id = document.getElementById('form-id').value;
            const data = {
                domain: document.getElementById('form-domain').value,
                plan: document.getElementById('form-plan').value,
                clientName: document.getElementById('form-clientName').value,
                clientEmail: document.getElementById('form-clientEmail').value,
                clientPhone: document.getElementById('form-clientPhone').value,
                notes: document.getElementById('form-notes').value
            };

            try {
                const result = await fetchAPI(id ? `/${id}` : '', {
                    method: id ? 'PATCH' : 'POST',
                    body: JSON.stringify(data)
                });

                if (result.success) {
                    closeModal();
                    loadLicenses();
                    alert(result.message);
                } else {
                    alert('Error: ' + (result.message || 'Error desconocido'));
                }
            } catch (error) {
                alert('Error al guardar: ' + error.message);
            }
        }

        function showActions(licenseId, domain) {
            currentLicense = { id: licenseId, domain };
            document.getElementById('actions-domain').textContent = domain;

            document.getElementById('actions-content').innerHTML = `
                <button onclick="editLicense('${licenseId}')"
                        class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-lg flex items-center gap-3">
                    <span class="text-xl">✏️</span>
                    <span>Editar datos</span>
                </button>
                <button onclick="changePlan('${licenseId}')"
                        class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-lg flex items-center gap-3">
                    <span class="text-xl">📊</span>
                    <span>Cambiar plan</span>
                </button>
                <button onclick="resetCounter('${licenseId}')"
                        class="w-full text-left px-4 py-3 hover:bg-gray-100 rounded-lg flex items-center gap-3">
                    <span class="text-xl">🔄</span>
                    <span>Resetear contador mensual</span>
                </button>
                <button onclick="revokeLicense('${licenseId}')"
                        class="w-full text-left px-4 py-3 hover:bg-red-50 text-red-600 rounded-lg flex items-center gap-3">
                    <span class="text-xl">🚫</span>
                    <span>Suspender licencia</span>
                </button>
                <button onclick="reactivateLicense('${licenseId}')"
                        class="w-full text-left px-4 py-3 hover:bg-green-50 text-green-600 rounded-lg flex items-center gap-3">
                    <span class="text-xl">✅</span>
                    <span>Reactivar licencia</span>
                </button>
            `;

            document.getElementById('actions-modal').classList.add('active');
        }

        function closeActionsModal() {
            document.getElementById('actions-modal').classList.remove('active');
            currentLicense = null;
        }

        async function editLicense(id) {
            closeActionsModal();
            const result = await fetchAPI(`/${id}`);
            if (result.success) {
                showEditModal(result.data);
            }
        }

        async function changePlan(id) {
            const newPlan = prompt('Nuevo plan (CHUPITO, CANA, MASCANA, UNLIMITED):');
            if (!newPlan) return;

            const resetCounter = confirm('¿Resetear también el contador de reservas?');

            try {
                const result = await fetchAPI(`/${id}/change-plan`, {
                    method: 'POST',
                    body: JSON.stringify({ plan: newPlan.toUpperCase(), resetCounter })
                });

                if (result.success) {
                    closeActionsModal();
                    loadLicenses();
                    alert(result.message);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function resetCounter(id) {
            if (!confirm('¿Resetear el contador de reservas a 0?')) return;

            try {
                const result = await fetchAPI(`/${id}/reset-counter`, { method: 'POST' });

                if (result.success) {
                    closeActionsModal();
                    loadLicenses();
                    alert(result.message);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function revokeLicense(id) {
            const reason = prompt('Motivo de la suspensión:');
            if (reason === null) return;

            try {
                const result = await fetchAPI(`/${id}/revoke`, {
                    method: 'POST',
                    body: JSON.stringify({ reason })
                });

                if (result.success) {
                    closeActionsModal();
                    loadLicenses();
                    alert(result.message);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function reactivateLicense(id) {
            if (!confirm('¿Reactivar esta licencia?')) return;

            try {
                const result = await fetchAPI(`/${id}/reactivate`, { method: 'POST' });

                if (result.success) {
                    closeActionsModal();
                    loadLicenses();
                    alert(result.message);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadLicenses);

        // Search on Enter
        document.getElementById('search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadLicenses();
        });
    </script>
</body>
</html>
