# =============================================================================
# Main Site - contacpro.app / www.contacpro.app
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name contacpro.app www.contacpro.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://contacpro.app$request_uri;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.contacpro.app;

    ssl_certificate /etc/letsencrypt/live/contacpro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contacpro.app/privkey.pem;

    return 301 https://contacpro.app$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name contacpro.app;

    # SSL
    ssl_certificate /etc/letsencrypt/live/contacpro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contacpro.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /var/www/main;
    index index.html;

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Widget CDN
    location /widget.js {
        alias /var/www/widget/widget.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/javascript";
    }

    location /widget.min.js {
        alias /var/www/widget/widget.min.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/javascript";
    }

    # CDN Assets
    location /cdn/ {
        alias /var/www/widget/;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1d;
    }

    # Static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images
    location /images {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon & robots
    location = /favicon.ico {
        expires 1M;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        expires 1d;
        access_log off;
        log_not_found off;
    }

    # Sitemap
    location = /sitemap.xml {
        expires 1d;
    }
}
