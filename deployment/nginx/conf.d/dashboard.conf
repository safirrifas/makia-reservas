# =============================================================================
# Dashboard - dashboard.contacpro.app
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.contacpro.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.contacpro.app;

    # SSL
    ssl_certificate /etc/letsencrypt/live/contacpro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contacpro.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.contacpro.app wss://api.contacpro.app;" always;

    root /var/www/dashboard;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        expires 1M;
        access_log off;
        log_not_found off;
    }

    # Robots
    location = /robots.txt {
        expires 1d;
        access_log off;
        log_not_found off;
    }
}
